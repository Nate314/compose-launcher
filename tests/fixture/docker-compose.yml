# Throwaway stack for the launcher tests: one tiny container publishing two ports.
services:
  web:
    image: busybox:stable
    command: sh -c "httpd -p 80 -h /tmp && httpd -f -p 81 -h /tmp"
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
      - "127.0.0.1:${ADMIN_PORT:-18081}:81"
